name: wheels

on:
  push:
    branches: [main]
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip build

      - name: Build wheel and sdist
        run: python -m build --wheel --sdist

      - name: Smoke test the wheel without the DIS extra
        run: |
          python -m venv /tmp/smoke
          /tmp/smoke/bin/pip install dist/*.whl
          /tmp/smoke/bin/python - <<'PY'
          import os
          import sys
          import pysos_interop
          # On a tag build the built version must be the tag, minus its leading `v`.
          if os.environ.get("GITHUB_REF_TYPE") == "tag":
              expected = os.environ["GITHUB_REF_NAME"].removeprefix("v")
              assert pysos_interop.__version__ == expected, (
                  f"built {pysos_interop.__version__}, tag {os.environ['GITHUB_REF_NAME']}")
          assert "opendis" not in sys.modules
          assert "pysos_rpr" not in sys.modules
          PY

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dist
          path: dist/

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@da05d552573ad5aba039eaac05058a918a7bf631 # v2.2.2
        with:
          files: dist/*
          fail_on_unmatched_files: true

name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Lint
        run: ruff check src tests

      - name: Tests
        run: python -m pytest -m "not network"

      - name: Core imports nothing third-party
        run: |
          python - <<'PY'
          import sys
          import pysos_interop
          import pysos_interop.dead_reckoning
          import pysos_interop.jsonl
          import pysos_interop.model
          import pysos_interop.rates
          import pysos_interop.transport
          heavy = {"numpy", "opendis"} & set(sys.modules)
          assert not heavy, f"core imported {sorted(heavy)}"
          PY

      - name: DIS extra imports
        run: python -c "import pysos_interop.dis"
